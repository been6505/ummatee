<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<script>/* ธีม: ค่าเริ่มต้นสว่าง · ปุ่มมุมขวาบน (theme-toggle.js) */try{if(localStorage.getItem('uh_theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<meta name="theme-color" content="#F2F3F7">
<title>สต็อก · Helpme+ หลังบ้าน</title>
<link rel="icon" href="../../assets/hm-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../admin.css?v=6">
<link rel="stylesheet" href="../pages.css?v=12">
<link rel="stylesheet" href="../theme.css?v=2">
<link rel="stylesheet" href="../helpme-skin.css?v=23">
<script src="../icons.js?v=1"></script>
</head>
<body>
<section id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="off">
    <img src="../../assets/helpme-logo.png" alt="Helpme+" width="230" height="33">
    <h1>สต็อก · Helpme+</h1>
    <p>สำหรับแอดมินและทีมอาสา ใส่รหัสทีมเพื่อเข้าใช้งาน</p>
    <label class="fld"><span>รหัสทีม</span><span class="pw-wrap"><input id="login-key" type="password" required autocomplete="current-password"><button type="button" class="pw-eye" data-pw-toggle aria-label="แสดงรหัส" aria-pressed="false" title="แสดงรหัส"><i data-ic="eye"></i></button></span></label>
    <label class="chk"><input id="login-remember" type="checkbox" checked><span>จำรหัสไว้ในเครื่องนี้</span></label>
    <button class="btn primary" id="login-go" type="submit">เข้าสู่ระบบ</button>
    <p class="err" id="login-err" role="alert"></p>
    <a class="back" href="https://ummatee-help.akasitlove.workers.dev/">← กลับหน้าเว็บหลัก</a>
  </form>
</section>
<div id="app" hidden>
  <header class="top">
    <a class="brand" href="../../admin.html"><img class="brand-logo" src="../../assets/helpme-logo.png" alt="Helpme+" width="166" height="24"><span><i class="brand-plus" aria-hidden="true">+</i> <b>หลังบ้าน</b></span></a>
    <nav class="tabs" aria-label="เมนูหลังบ้าน"><a href="../dashboard/">แดชบอร์ด</a><a href="../../admin.html">จัดการเคส</a><a href="../teams/">จัดทีม</a><a href="../stock/" aria-current="page">สต็อก</a><a href="../covered/">พื้นที่มอบแล้ว</a></nav>
    <div class="top-r"><span class="sync" id="sync"></span><button class="btn ghost sm" id="refresh"><i data-ic="refresh"></i> โหลดใหม่</button><button class="btn ghost sm theme-btn" id="logout" type="button" aria-label="ออกจากระบบ" title="ออกจากระบบ"><i data-ic="logout"></i></button></div>
  </header>
  <main class="wrap" id="main">
    <div class="views" role="tablist" aria-label="มุมมองสต็อก"><button role="tab" data-view="stock" aria-selected="true"><i data-ic="box"></i> คลังของ</button><button role="tab" data-view="bags" aria-selected="false"><i data-ic="box"></i> ถุงยังชีพ <span class="vbadge" id="bag-badge"></span></button></div>
    <div id="view-stock">
    <section class="stats" id="stats" aria-label="สรุปสต็อก"></section>
    <div class="lowchips" id="lowchips" aria-label="ของที่หมดหรือใกล้หมด"></div>
    <section class="bar">
      <div class="bar-top"><label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="ค้นหาของในคลัง" aria-label="ค้นหาของในคลัง"></label><button class="btn primary sm" id="add-item">+ เพิ่มรายการ</button></div>
      <div class="bar-row"><div class="seg" role="tablist" id="cat"></div><button class="btn ghost sm" id="copy-need">คัดลอกรายการที่ต้องการ</button><button class="btn ghost sm" id="export">⬇ CSV</button></div>
    </section>
    <div class="cols cols-stock">
      <section class="panel"><div id="items"></div></section>
      <section class="panel">
        <div class="panel-h"><h2>ต้องการ</h2></div><ul id="need-list" class="need-list"></ul>
        <div class="panel-h mt"><h2>ประวัติรับเข้า / จ่ายออก</h2></div><div id="log" class="log"></div>
      </section>
    </div>
    </div>

    <div id="view-bags" hidden>
      <section class="stats" id="bag-stats" aria-label="สรุปถุงยังชีพ"></section>
      <div class="cols cols-stock">
        <section class="panel">
          <div class="panel-h"><h2>ทีมรถ</h2><button class="btn primary sm" id="add-team">+ เพิ่มทีมรถ</button></div>
          <p class="muted small" id="bag-hint"></p>
          <div id="bag-teams" class="team-list"></div>
        </section>
        <section class="panel">
          <div class="panel-h"><h2>ถุงยังชีพในคลัง</h2><button class="btn ghost sm" id="add-bag">+ เพิ่มชนิดถุง</button></div>
          <div id="bag-items" class="bag-items"></div>
          <div class="panel-h mt"><h2>ส่งถุงขึ้นรถ / คืนถุง</h2></div><div id="bag-log" class="log"></div>
        </section>
      </div>
    </div>

  </main>
</div>
<div class="drawer-bg" id="drawer-bg" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="../common.js?v=1"></script>
<script src="./stock.js?v=9"></script>
<script src="../theme-toggle.js?v=2"></script>
<script src="../chat.js?v=5"></script>
<script>/* ปุ่มแสดง/ซ่อนรหัสในช่องเข้าระบบ */document.addEventListener("click",e=>{const b=e.target.closest("[data-pw-toggle]");if(!b)return;const i=b.parentElement.querySelector("input");const show=i.type==="password";i.type=show?"text":"password";b.setAttribute("aria-pressed",String(show));b.setAttribute("aria-label",show?"ซ่อนรหัส":"แสดงรหัส");b.title=b.getAttribute("aria-label");b.innerHTML=ic(show?"eyeoff":"eye");i.focus()});</script>
</body>
</html>
