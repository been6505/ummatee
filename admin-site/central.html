<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<script>/* ธีม: ค่าเริ่มต้นสว่าง · ปุ่มมุมขวาบน (theme-toggle.js) */try{if(localStorage.getItem('uh_theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<meta name="theme-color" content="#F2F3F7">
<title>CENTRAL · Helpme+ ช่วยเหลือฉุกเฉิน</title>
<link rel="icon" href="./assets/hm-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./admin.css?v=16">
<link rel="stylesheet" href="./central/theme.css?v=2">
<link rel="stylesheet" href="./central/helpme-skin.css?v=35">
<link rel="stylesheet" href="./central/hm-ui.css?v=16">
<script src="./central/icons.js?v=6"></script>
</head>
<body>
<!-- ===== เข้าสู่ระบบ ===== -->
<section id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="off">
    <img src="./assets/helpme-logo.png" alt="Helpme+" width="230" height="33">
    <h1>HELP ME CENTRAL</h1>
    <p>สำหรับทีมอาสาและแอดมิน ใส่รหัสทีมเพื่อดูและจัดการเคส</p>
    <label class="fld"><span>รหัสทีม</span><span class="pw-wrap"><input id="login-key" type="password" required autocomplete="current-password"><button type="button" class="pw-eye" data-pw-toggle aria-label="แสดงรหัส" aria-pressed="false" title="แสดงรหัส"><i data-ic="eye"></i></button></span></label>
    <label class="chk"><input id="login-remember" type="checkbox" checked><span>จำรหัสไว้ในเครื่องนี้</span></label>
    <button class="btn primary" id="login-go" type="submit">เข้าสู่ระบบ</button>
    <p class="err" id="login-err" role="alert"></p>
    <a class="back" href="https://ummatee-help.akasitlove.workers.dev/">← กลับหน้าเว็บหลัก</a>
  </form>
</section>

<!-- ===== CENTRAL ===== -->
<div id="app" class="app" hidden>
  <header class="top">
    <a class="brand" href="./central.html"><img class="brand-logo" src="./assets/helpme-logo.png" alt="Helpme+" width="166" height="24"><span><i class="brand-plus" aria-hidden="true">+</i> <b>CENTRAL</b></span></a>
    <nav class="tabs" aria-label="เมนู CENTRAL"><a href="./central/dashboard/">แดชบอร์ด</a><a href="./central.html" aria-current="page">จัดการเคส</a><a href="./central/warroom/">War Room</a><a href="./central/teams/">จัดทีม</a><a href="./central/stock/">สต็อก</a><a href="./central/news/">ข่าว</a><a href="./central/broadcast/">ประกาศ</a><a href="./central/settings/">ตั้งค่า</a></nav>
    <div class="top-r">
      <span class="sync" id="sync"></span>
      <button class="btn ghost sm" id="refresh" title="โหลดใหม่"><i data-ic="refresh"></i> โหลดใหม่</button>
      <button class="btn ghost sm theme-btn" id="logout" type="button" aria-label="ออกจากระบบ" title="ออกจากระบบ"><i data-ic="logout"></i></button>
    </div>
  </header>

  <main class="wrap">
    <div class="seg view-sw" role="tablist" aria-label="มุมมองเคส"><button role="tab" data-view="cases" aria-selected="true"><i data-ic="list"></i> เคสในระบบ</button><button role="tab" data-view="leads" aria-selected="false"><i data-ic="megaphone"></i> รอคัดจากโซเชียล <b class="vbadge" id="leads-n" hidden></b></button></div>
    <section id="leads-view" class="leads-view" hidden aria-label="เคสจากโซเชียลรอคัด"></section>
    <section class="stats" id="stats" aria-label="สรุปเคส"></section>

    <section class="bar">
      <div class="bar-top"><label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="ค้นหา: ชื่อ เบอร์ ที่อยู่ เขต ความต้องการ เลขเคส ทีม" aria-label="ค้นหาเคส"></label><button class="btn ghost sm f-toggle" id="f-toggle" aria-expanded="false" aria-controls="filters-box">ตัวกรอง<b id="f-n" hidden></b></button></div>
      <div class="bar-row">
        <div class="filters-box" id="filters-box">
        <select id="f-status" aria-label="สถานะ"><option value="active">ยังไม่เสร็จ</option><option value="open">รอความช่วยเหลือ</option><option value="going">ทีมกำลังไป</option><option value="done">ช่วยเหลือแล้ว</option><option value="all">ทั้งหมด</option></select>
        <select id="f-urg" aria-label="ความเร่งด่วน"><option value="">ทุกระดับ</option><option value="3">วิกฤต</option><option value="2">เร่งด่วน</option><option value="1">ทั่วไป</option></select>
        <select id="f-need" aria-label="ความต้องการ"><option value="">ทุกความต้องการ</option><option>อพยพ</option><option value="ผู้ป่วย">ผู้ป่วย / ผู้สูงอายุ</option><option value="อาหาร">อาหาร / น้ำดื่ม</option><option>ยา</option><option>ของใช้เด็ก</option><option value="เรือ">เรือ / รถสูง</option><option value="อื่น">อื่น ๆ</option></select>
        <select id="f-vr" aria-label="ผลตรวจพื้นที่"><option value="">ผลตรวจ: ทั้งหมด</option><option value="verified">ลำบาก + ยืนยันแล้ว</option><option value="confirmed">วิกฤตจริง</option><option value="likely">น่าจะวิกฤต</option><option value="conflict">ข้อมูลขัดแย้ง</option><option value="unverified">รอตรวจเพิ่ม</option><option value="notcrit">ไม่น่าวิกฤต</option><option value="covered">องค์กรอื่นเคยส่งมอบใกล้เคียง</option><option value="notcovered">ยังไม่มีองค์กรอื่นส่งมอบใกล้เคียง</option><option value="nopin">ยืนยันไม่ได้ (ไม่มีพิกัด/ที่อยู่)</option></select>
        <select id="f-zone" aria-label="โซน"><option value="">ทุกโซน</option></select>
        <select id="f-sort" aria-label="เรียงตาม"><option value="urg">เรียง: วิกฤตก่อน</option><option value="new">เรียง: ใหม่สุด</option><option value="old">เรียง: รอนานสุด</option><option value="ppl">เรียง: คนมากสุด</option><option value="score">เรียง: คะแนนวิกฤต (ตรวจพื้นที่)</option></select>
        </div>
        <div class="seg" role="tablist" aria-label="มุมมอง"><button role="tab" data-mode="both" aria-selected="true">แผนที่ + รายการ</button><button role="tab" data-mode="list" aria-selected="false">รายการ</button><button role="tab" data-mode="map" aria-selected="false">แผนที่เต็ม</button></div>
        <button class="btn ghost sm" id="export">⬇ CSV</button>
      </div>
      <p class="count" id="count" aria-live="polite"></p>
    </section>

    <section id="map-wrap" class="map-wrap">
      <div class="map-body">
        <div class="map-cell">
          <div id="map"></div>
          <div class="mx-legend" id="map-legend" aria-label="คำอธิบายสีบนแผนที่"></div>
          <div class="mx-fabs" id="mx-fabs"></div>
          <div class="layer-menu" id="layer-menu" role="dialog" aria-label="แบบแผนที่และชั้นข้อมูล" hidden></div>
        </div>
        <aside class="map-side" id="map-side" aria-label="โซนและเส้นทาง"></aside>
      </div>
    </section>
    <section id="list" class="list"></section>
  </main>
</div>

<!-- ===== รายละเอียดเคส ===== -->
<div class="drawer-bg" id="drawer-bg" hidden></div>
<aside class="drawer" id="drawer" aria-label="รายละเอียดเคส" hidden></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="./central/verify.js?v=11"></script>
<script src="./central/covered.js?v=9"></script>
<script src="./admin.js?v=32"></script>
<script src="./central/ofm.js?v=1"></script>
<script src="./central/camlive.js?v=8"></script>
<script src="./central/mapx.js?v=12"></script>
<script src="./central/leadsview.js?v=3"></script>
<script src="./central/theme-toggle.js?v=2"></script>
<script src="./central/chat.js?v=7"></script>
<script src="./central/feedback.js?v=1"></script>
<script src="./central/localai.js?v=3"></script>
<script src="./central/hermes.js?v=8"></script>
<script src="./central/kbfit.js?v=1"></script>
<script>/* ปุ่มแสดง/ซ่อนรหัสในช่องเข้าระบบ */document.addEventListener("click",e=>{const b=e.target.closest("[data-pw-toggle]");if(!b)return;const i=b.parentElement.querySelector("input");const show=i.type==="password";i.type=show?"text":"password";b.setAttribute("aria-pressed",String(show));b.setAttribute("aria-label",show?"ซ่อนรหัส":"แสดงรหัส");b.title=b.getAttribute("aria-label");b.innerHTML=ic(show?"eyeoff":"eye");i.focus()});</script>
<script src="./bc.js?v=2" data-mode="staff" defer></script>
</body>
</html>
