<script>const W={cases:[]};const room=()=>null,view=()=>({cases:W.cases});
async function bdCases(){try{const [a,b]=await Promise.all([apiGet({action:'list'}).catch(()=>null),apiGet({action:'helpme_cases'}).catch(()=>null)]);
  W.cases=[...((b&&b.cases)||[]).map(c=>({...c,hmId:c.id})),...((a&&a.cases)||[])].map(c=>({...c,needs:Array.isArray(c.needs)?c.needs:String(c.needs||'').split(/\s*,\s*/).filter(Boolean)}))}catch(e){}}
adminBoot({action:'chat_rev'},'rev',()=>{BOARD.show();bdCases();$('#refresh').onclick=()=>BOARD.show()});</script>
