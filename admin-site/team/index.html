<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F3F7">
<title>แชทกับศูนย์ · Helpme+</title>
<link rel="icon" href="../assets/hm-icon-192.png">
<link rel="apple-touch-icon" href="../assets/hm-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* หน้าแชทสำหรับทีมอาสา (มือถือ) · สีและรูปทรงแบบ Help Me */
:root{--primary:#2D45C8;--primary-2:#2338A8;--ink:#161B3D;--muted:#5B6386;--line:#E3E6EF;--bg:#F2F3F7;--tint:#E9ECFB;--ok:#2E9E57;--red:#E5383B;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","IBM Plex Sans Thai",system-ui,sans-serif;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.5 var(--font);background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
button,input,select{font:inherit}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);position:sticky;top:0;z-index:2}
.top img{height:22px}.top .who{flex:1;min-width:0}.top .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .who small{color:var(--muted);font-size:12px}
.ghost{border:0;background:var(--tint);color:var(--primary);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(22,27,61,.1);padding:24px 20px;margin:auto;width:min(420px,calc(100% - 28px));display:grid;gap:14px}
.card img{width:200px;margin:0 auto}.card h1{margin:0;font-size:20px;text-align:center}.card p{margin:0;color:var(--muted);font-size:14px;text-align:center}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
input,select{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;font-size:16px;width:100%}
.primary{border:0;background:var(--primary);color:#fff;border-radius:999px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 16px rgba(45,69,200,.3)}
.err{color:var(--red);font-size:14px;text-align:center;min-height:1.2em}
#msgs{flex:1;overflow:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:6px}
.m{max-width:82%;padding:9px 13px;border-radius:18px;background:#fff;box-shadow:0 1px 2px rgba(22,27,61,.06);word-wrap:break-word}
.m p{margin:0;white-space:pre-wrap}.m small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.m.hq{align-self:flex-start;border-bottom-left-radius:6px}.m.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:6px}.m.me small{color:rgba(255,255,255,.75)}
.m.me a{color:#fff}.m .who{font-weight:700;color:var(--primary);font-size:12px;margin:0 0 2px}
.day{align-self:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.7);border-radius:999px;padding:2px 10px;margin:6px 0}
.empty{color:var(--muted);text-align:center;margin:auto;font-size:14px;padding:20px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
form.send{display:flex;gap:8px;padding:8px 12px calc(10px + var(--safe-b));background:rgba(255,255,255,.92);box-shadow:0 -1px 0 var(--line)}
form.send input{border-radius:999px;padding:11px 16px}
form.send button{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:18px;cursor:pointer}
.loc{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--tint);font-size:18px;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<!-- เข้าระบบ -->
<section class="card" id="login" hidden>
  <img src="../assets/helpme-logo.png" alt="Helpme+" width="200" height="29">
  <h1>แชทกับศูนย์ประสานงาน</h1>
  <p>สำหรับทีมอาสา · ใส่รหัสทีม แล้วเลือกชื่อทีมของคุณ</p>
  <form id="lf" style="display:grid;gap:12px">
    <label>รหัสทีม<input id="code" type="password" autocomplete="current-password" required></label>
    <label>ชื่อทีม<input id="team" list="teams" required maxlength="60" placeholder="เช่น ทีมเรือ 1"><datalist id="teams"></datalist></label>
    <label>ชื่อคุณ (ไม่บังคับ)<input id="name" maxlength="60" placeholder="เช่น หัวหน้าทีม"></label>
    <button class="primary" type="submit" id="go">เข้าแชท</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</section>
<!-- แชท -->
<header class="top" id="top" hidden><img src="../assets/helpme-logo.png" alt="Helpme+" width="152" height="22"><div class="who"><b id="tname"></b><small id="st">แชทกับศูนย์</small></div><button class="ghost" id="out" type="button">ออก</button></header>
<main id="msgs" hidden aria-live="polite"></main>
<div class="quick" id="quick" hidden><button type="button">รับทราบ</button><button type="button">กำลังเดินทาง</button><button type="button">ถึงจุดแล้ว</button><button type="button">ช่วยเสร็จแล้ว</button><button type="button">ต้องการกำลังเสริม</button><button type="button">ของไม่พอ</button></div>
<form class="send" id="send" hidden><button class="loc" type="button" id="loc" aria-label="ส่งตำแหน่งของฉัน" title="ส่งตำแหน่งของฉัน">📍</button><input id="in" maxlength="1000" placeholder="พิมพ์ข้อความถึงศูนย์…" autocomplete="off" aria-label="ข้อความ"><button type="submit" aria-label="ส่ง">➤</button></form>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const S={key:st.get('uh_vol_key'),team:st.get('uh_chat_team')||new URLSearchParams(location.search).get('t')||'',name:st.get('uh_chat_name'),msgs:[],timer:null,lastN:0};
const api=async p=>(await fetch('/api?'+new URLSearchParams({...p,key:S.key,t:Date.now()}),{cache:'no-store'})).json();
const post=async b=>(await fetch('/api',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,key:S.key})})).json();
const hhmm=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),day=t=>new Date(t).toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});
function show(chat){$('#login').hidden=chat;['#top','#msgs','#quick','#send'].forEach(s=>$(s).hidden=!chat);if(chat){$('#tname').textContent=S.team;poll(true);clearInterval(S.timer);S.timer=setInterval(()=>poll(),document.hidden?20000:5000)}}
async function login(e){e&&e.preventDefault();const k=$('#code').value.trim()||S.key,t=$('#team').value.trim(),n=$('#name').value.trim();if(!k||!t)return;
  $('#go').disabled=true;$('#err').textContent='กำลังตรวจรหัส…';S.key=k;
  try{const r=await api({action:'chat',team:t});if(r&&r.ok){S.team=t;S.name=n;st.set('uh_vol_key',k);st.set('uh_chat_team',t);st.set('uh_chat_name',n);$('#err').textContent='';show(true)}
    else{$('#err').textContent=r&&r.error==='not_volunteer'?'รหัสทีมไม่ถูกต้อง':'เข้าไม่ได้ ลองใหม่';S.key=''}}catch(err){$('#err').textContent='เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต'}finally{$('#go').disabled=false}}
function draw(){const box=$('#msgs'),bottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;let ld='';
  box.innerHTML=S.msgs.length?S.msgs.map(m=>{const d=day(m.at),sep=d!==ld?`<p class="day">${esc(d)}</p>`:'';ld=d;const mine=m.sender==='team';
    const loc=m.lat!=null?`<p><a href="https://maps.google.com/?q=${+m.lat},${+m.lng}" target="_blank" rel="noopener">📍 ตำแหน่ง${mine?'ของฉัน':''} · เปิดแผนที่</a></p>`:'';
    return `${sep}<div class="m ${mine?'me':'hq'}">${mine?'':`<p class="who">ศูนย์${m.name?' · '+esc(m.name):''}</p>`}${m.text?`<p>${esc(m.text)}</p>`:''}${loc}<small>${mine&&m.name?esc(m.name)+' · ':''}${hhmm(m.at)}${mine&&m.readHq?' · ศูนย์อ่านแล้ว':''}</small></div>`}).join(''):'<p class="empty">ยังไม่มีข้อความ · ทักศูนย์ได้เลย หรือกดข้อความด่วนด้านล่าง</p>';
  if(bottom||S.first){box.scrollTop=box.scrollHeight;S.first=false}}
async function poll(first){if(!S.key||!S.team)return;try{const r=await api({action:'chat',team:S.team});if(!r.ok){if(r.error==='not_volunteer'){logout('รหัสทีมเปลี่ยนแล้ว กรุณาเข้าใหม่')}return}
  const last=(r.messages.slice(-1)[0]||{}).n||0,newHq=r.messages.filter(m=>m.sender==='hq'&&m.n>S.lastN).length;
  if(!first&&newHq){try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}ding();if(document.hidden)document.title='('+newHq+') ข้อความใหม่ · Helpme+'}
  if(first)S.first=true;S.lastN=last;S.msgs=r.messages;draw();$('#st').textContent='แชทกับศูนย์ · อัปเดต '+hhmm(Date.now());
  if(!document.hidden&&r.messages.some(m=>m.sender==='hq'&&!m.readTeam))post({action:'chat_read',team:S.team,side:'team'})}catch(e){$('#st').textContent='ออฟไลน์ · จะลองใหม่'}}
function ding(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.18)}catch(e){}}
async function send(text,extra={}){if(!text&&extra.lat==null)return;S.msgs.push({n:0,sender:'team',name:S.name,text,at:Date.now(),...extra});draw();$('#msgs').scrollTop=1e9;
  try{const r=await post({action:'chat_send',team:S.team,from:'team',name:S.name,text,...extra});if(!r.ok)throw 0}catch(e){$('#st').textContent='ส่งไม่สำเร็จ ลองใหม่'}poll()}
function logout(msg){clearInterval(S.timer);st.set('uh_chat_team','');S.team='';show(false);$('#err').textContent=msg||''}
$('#lf').addEventListener('submit',login);
$('#send').addEventListener('submit',e=>{e.preventDefault();const i=$('#in'),t=i.value.trim();if(!t)return;i.value='';send(t)});
$('#quick').addEventListener('click',e=>{const b=e.target.closest('button');if(b)send(b.textContent)});
$('#loc').addEventListener('click',()=>{if(!navigator.geolocation){alert('เครื่องนี้หาตำแหน่งไม่ได้');return}$('#st').textContent='กำลังหาตำแหน่ง…';
  navigator.geolocation.getCurrentPosition(p=>send('',{lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)}),()=>{$('#st').textContent='เปิดตำแหน่งไม่ได้ · อนุญาตตำแหน่งในการตั้งค่า'},{enableHighAccuracy:true,timeout:15000})});
$('#out').addEventListener('click',()=>logout('ออกจากแชทแล้ว'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){document.title='แชทกับศูนย์ · Helpme+';poll()}if(S.team){clearInterval(S.timer);S.timer=setInterval(()=>poll(),document.hidden?20000:5000)}});
$('#team').value=S.team;$('#name').value=S.name;
if(S.key&&S.team)login();else show(false);
/* รายชื่อทีมให้เลือก (ต้องมีรหัสถูกก่อน) */
$('#code').addEventListener('change',async()=>{S.key=$('#code').value.trim();try{const r=await api({action:'roster'});if(r.ok)$('#teams').innerHTML=r.roster.map(t=>`<option value="${esc(t.name)}">`).join('')}catch(e){}});
</script>
</body>
</html>
